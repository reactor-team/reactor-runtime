$schema: reactor/v2

# The endurance suite's model split in two: the tracked echo is the session
# half, and its EchoModel runs in a model worker (`reactor-runtime
# serve-worker`) that the scenario starts beside the runtime, so every step
# crosses to the worker and back through its socket and shared memory.
model:
  name: echo-endurance-shared-worker
  version: v0.0.1
  description: The endurance suite's tracked echo, its engine in a shared model worker.

runtime:
  import: shared_worker_echo:SharedWorkerEcho
  worker: echo_worker:EchoWorker
