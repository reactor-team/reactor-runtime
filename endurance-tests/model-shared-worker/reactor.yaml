$schema: reactor/v2

# The endurance suite's model split in two: the tracked echo is the
# application half, and its EchoModel runs in a model server (`python -m
# reactor_runtime.model_server`) that the scenario starts beside the runtime,
# so every step crosses to the model server and back through its socket and
# shared memory.
model:
  name: echo-endurance-shared-worker
  version: v0.0.1
  description: The endurance suite's tracked echo, its engine in a shared model server.

runtime:
  import: shared_worker_echo:SharedWorkerEcho
  worker:
    import: echo_server:EchoServer
