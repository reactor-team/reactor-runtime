[build-system]
requires = ["uv_build>=0.11.22,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Ship two top-level packages in one wheel: the runtime, and the generated
# wire-protocol bindings (reactor_wire.v1). The bindings are not committed; the
# build vendors them from the pinned wire/v* release into src/reactor_wire/
# before packaging (see scripts/fetch-wire.py and the build make target).
module-name = ["reactor_runtime", "reactor_wire"]
namespace = true

# The released wire-protocol language package this runtime vendors. CalVer,
# matching a wire/v<version> GitHub release tag (e.g. 1.20260618.42). The 0.0.0
# placeholder is unset: it resolves to no release until the first wire/v* is
# cut. Bump it to adopt a release; buf breaking keeps the line compatible.
[tool.reactor-wire]
version = "1.20260619.2"

[project]
name = "reactor-runtime"
version = "0.1.0"
description = "A Python framework for building real-time, interactive video models"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Reactor", email = "team@reactor.inc" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.138.0",
    "numpy>=2.1",
    "protobuf>=7.35.1",
    "pygobject>=3.56.3",
    "pyyaml>=6.0.3",
    "uvicorn>=0.49.0",
]

[project.urls]
Source = "https://github.com/reactor-team/reactor-runtime"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest",
    "pytest-asyncio",
    "types-protobuf",
    "types-pyyaml>=6.0.12.20260518",
]

[tool.ruff]
line-length = 100
src = ["src", "tests", "examples"]
# Honour the excludes below even when the pre-commit hook passes file paths
# explicitly, so the faithfully-ported GStreamer subtree is never linted.
force-exclude = true
# Vendored protobuf bindings are generated, never linted or hand-edited. The
# GStreamer media engine is a faithful port of dynamic GStreamer code carried
# over from the original runtime; it is held to behaviour, not house style.
extend-exclude = [
    "src/reactor_wire",
    "src/reactor_runtime/transport/webrtc/gstreamer",
    "tests/unit/transport/webrtc/gstreamer",
]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade (keeps syntax at the 3.12 floor)
    "B",     # bugbear
    "C4",    # comprehensions
    "SIM",   # simplify
    "RET",   # return statements
    "RUF",   # ruff-specific
    "D",     # pydocstyle
    "PT",    # pytest style
    "ASYNC", # async pitfalls
    "TID",   # tidy imports (bans relative-import escapes)
]
ignore = [
    "D105", # magic methods rarely need docstrings
    "D107", # __init__ is documented on the class
]

[tool.ruff.lint.isort]
# The example models are first-party even though they live outside the package.
known-first-party = ["examples"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ty.environment]
python = ".venv"
python-version = "3.12"
# Import roots ty would not otherwise search: the repo root, so the example
# models (`examples`, first-party but outside the package) resolve the way
# pytest's pythonpath makes them importable; and the WebRTC test directory, so
# its tests can import their sibling `conftest` for the shared peer fakes.
extra-paths = [".", "tests/unit/transport/webrtc"]

[tool.ty.src]
# Check the package, its tests, and the example models; scripts/ ships developer
# tooling that is not part of the published package surface.
include = ["src", "tests", "examples"]
# Generated bindings ship their own stubs; the GStreamer subtree is a faithful
# port verified by behaviour, not strict types.
exclude = [
    "src/reactor_wire",
    "src/reactor_runtime/transport/webrtc/gstreamer",
    "tests/unit/transport/webrtc/gstreamer",
    # Registry-isolation scaffolding: it saves and restores the process-global
    # registries through their dynamic mapping surface, so it is not shipped
    # code and is kept out of the strict check.
    "tests/unit/conftest.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The example models live at the repo root (outside the package) so they are not
# shipped; put the root on the path so the suite can import them.
pythonpath = ["."]
