[build-system]
requires = ["uv_build>=0.11.22,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Ship two top-level packages in one wheel: the runtime, and the generated
# wire-protocol bindings (reactor_wire.v1). The bindings are not committed; the
# build vendors them from the pinned wire/v* release into src/reactor_wire/
# before packaging (see scripts/fetch-wire.py and the build make target).
module-name = ["reactor_runtime", "reactor_wire"]
namespace = true

# The released wire-protocol language package this runtime vendors. CalVer,
# matching a wire/v<version> GitHub release tag (e.g. 1.20260618.42). The 0.0.0
# placeholder is unset: it resolves to no release until the first wire/v* is
# cut. Bump it to adopt a release; buf breaking keeps the line compatible.
[tool.reactor-wire]
version = "1.20260619.2"

[project]
name = "reactor-runtime"
version = "0.1.0"
description = "A Python framework for building real-time, interactive video models"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Reactor", email = "team@reactor.inc" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.138.0",
    "numpy>=2.1",
    "protobuf>=7.35.1",
    "pygobject>=3.56.3",
]

[project.urls]
Source = "https://github.com/reactor-team/reactor-runtime"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "lefthook",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "ruff",
    "types-protobuf",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Honour the excludes below even when the pre-commit hook passes file paths
# explicitly, so the faithfully-ported GStreamer subtree is never linted.
force-exclude = true
# Vendored protobuf bindings are generated, never linted or hand-edited. The
# GStreamer media engine is a faithful port of dynamic GStreamer code carried
# over from the original runtime; it is held to behaviour, not house style.
extend-exclude = [
    "src/reactor_wire",
    "src/reactor_runtime/transport/webrtc/gstreamer",
    "tests/unit/transport/webrtc/gstreamer",
]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade (keeps syntax at the 3.12 floor)
    "B",     # bugbear
    "C4",    # comprehensions
    "SIM",   # simplify
    "RET",   # return statements
    "RUF",   # ruff-specific
    "D",     # pydocstyle
    "PT",    # pytest style
    "ASYNC", # async pitfalls
    "TID",   # tidy imports (bans relative-import escapes)
]
ignore = [
    "D105", # magic methods rarely need docstrings
    "D107", # __init__ is documented on the class
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
# Vendored protobuf bindings ship their own .pyi stubs; do not type-check the
# generated .py bodies (callers still get types from the stubs). The GStreamer
# media engine is a faithful port of dynamic GStreamer code and is not held to
# strict typing (see the override below).
exclude = [
    "src/reactor_wire/",
    "src/reactor_runtime/transport/webrtc/gstreamer/",
    "tests/unit/transport/webrtc/gstreamer/",
]

# The ported GStreamer subtree leans on GStreamer's dynamic GObject surface and
# is verified by behaviour, not by the strict type checker.
[[tool.mypy.overrides]]
module = "reactor_runtime.transport.webrtc.gstreamer.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "gi.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
