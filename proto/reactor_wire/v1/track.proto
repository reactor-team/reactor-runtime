syntax = "proto3";

package reactor_wire.v1;

// Request to claim the single publisher slot for an input track.
message PublishTrack {
  string name = 1;
}

// Stop sending the named output track to this connection. The other
// connections and the model are unaffected.
message PauseTrack {
  string name = 1;
}

// Send a paused output track to this connection again. Output tracks start
// paused, so this is also how a connection first receives one. An encoded step
// track's first frames after it start at a keyframe (see FrameEncoding).
message ResumeTrack {
  string name = 1;
}

// Release the publisher slot for an input track.
message UnpublishTrack {
  string name = 1;
}

// Successful response to a PublishTrack request. A failure is carried as an
// Error in the same response slot instead.
message PublishTrackResponse {
  string name = 1;
}
