syntax = "proto3";

package reactor_wire.v1;

import "google/protobuf/struct.proto";

// Liveness heartbeat from the client.
message Ping {}

// Request for the model's schema.
message RequestSchema {}

// The model's schema, carried as an OpenAPI document.
message ModelSchema {
  google.protobuf.Struct openapi = 1;
}

// Notification that a client upload completed and can now be referenced.
message FileUploaded {
  string upload_id = 1;
  string name = 2;
  string mime_type = 3;
  int64 size = 4;
}

// Request a clip of the last duration_seconds of output.
message RequestClip {
  double duration_seconds = 1;
}

// Request a recording of the session so far.
message RequestRecording {}

// A clip or recording is being prepared.
message ClipReady {
  string session_id = 1;
  string kind = 2;
  double start_marker = 3;
  double end_marker = 4;
  double now_marker = 5;
  int64 predicted_ready_at_ms = 6;
  string playlist_url = 7;
}

// A clip or recording request failed.
message ClipFailed {
  string reason = 1;
}

// A content-moderation verdict delivered to the client. A "terminate" action
// means the session is about to end; "warn" is informational and the session
// continues. Fields the sender cannot attribute are left empty.
message Moderation {
  string action = 1;
  string input_kind = 2;
  string command = 3;
  repeated string categories = 4;
  string message = 5;
}

// The platform is ending the session, and this is why. Sent best-effort
// before the connections close, so the client sees the reason rather than a
// bare disconnect. `reason` is the platform-authored, human-readable
// description of the cause, delivered verbatim for the client to display.
message SessionEnded {
  string reason = 1;
}

// A negotiated video codec. New values need a schema change, so this covers
// only the codecs currently in use — extend it as new ones are adopted.
enum VideoCodec {
  VIDEO_CODEC_UNSPECIFIED = 0;
  VIDEO_CODEC_VP8 = 1;
  VIDEO_CODEC_VP9 = 2;
  VIDEO_CODEC_AV1 = 3;
  VIDEO_CODEC_H264 = 4;
  VIDEO_CODEC_H265 = 5;
}

// A negotiated audio codec. Same extend-as-adopted rule as VideoCodec.
enum AudioCodec {
  AUDIO_CODEC_UNSPECIFIED = 0;
  AUDIO_CODEC_OPUS = 1;
}

// A track's media kind. Unlike a codec, this set never grows — every WebRTC
// track is video or audio, permanently.
enum TrackKind {
  TRACK_KIND_UNSPECIFIED = 0;
  TRACK_KIND_VIDEO = 1;
  TRACK_KIND_AUDIO = 2;
}

// A track's direction, from the client's own perspective. The opposite
// polarity of reactor_runtime's own (model-perspective) TrackDirection
// (IN/OUT) — this one is client-perspective (RECVONLY/SENDONLY) — different
// types in different packages, kept distinctly named so the two are never
// confused reading wire and runtime code side by side.
enum TrackDirection {
  TRACK_DIRECTION_UNSPECIFIED = 0;
  TRACK_DIRECTION_RECVONLY = 1;
  TRACK_DIRECTION_SENDONLY = 2;
}

// One WebRTC quality reading the client took for one of its tracks, from its
// own media engine's statistics (getStats() in a browser) — the runtime has no
// other vantage point onto a client's receive-side experience. `kind`/`direction`/`codec` are fixed,
// structural facts about the track (never a new value at runtime), so they
// stay typed; `metrics` is where the actual measurements live (e.g.
// "bitrate_bps", "frames_per_second", "packets_lost", "packets_received",
// "jitter_ms", "round_trip_time_ms", "frames_decoded", "frames_dropped",
// "frame_width", "frame_height", "nack_count", "keyframe_requests") — that
// set grows as new stats become worth reporting, without a schema change.
//
// `codec`'s oneof only keeps `video_codec`/`audio_codec` from being set at
// the same time — it does not, and structurally cannot, tie either one to
// `kind`. A conforming sender always sets the arm matching `kind`
// (`video_codec` for TRACK_KIND_VIDEO, `audio_codec` for TRACK_KIND_AUDIO),
// but nothing on the wire rejects a message that doesn't. A consumer must
// treat a codec arm that doesn't match `kind` as absent (the same as an
// unrecognized or *_UNSPECIFIED value) rather than decode it — never trust
// `kind` and the codec arm to agree without checking.
message ClientTrackStat {
  // Epoch milliseconds, the client's own clock.
  int64 timestamp = 1;
  string track_name = 2;
  TrackKind kind = 3;
  TrackDirection direction = 4;
  oneof codec {
    VideoCodec video_codec = 5;
    AudioCodec audio_codec = 6;
  }
  // Whether the client has this track paused right now.
  bool paused = 7;
  map<string, double> metrics = 8;
  // Where this track's frames spent their time, stage by stage, over the
  // window since the previous batch. Video tracks only. See FrameStage.
  repeated FrameStage frame_stages = 9;
  // The codec implementation the client runs for this video track, as the
  // media engine names it: the encoder for a track the client sends, the
  // decoder for one it receives, e.g. "libvpx" or "VideoToolbox". Empty until
  // the first frame is encoded or decoded, and on an audio track. This is the
  // implementation at the time of the reading: the engine can switch it
  // mid-session (e.g. falling back from hardware to software after an encoder
  // error), so group by it per reading, not per session.
  string codec_implementation = 10;
  // Whether that implementation is power efficient, as WebRTC's
  // powerEfficientEncoder / powerEfficientDecoder stats report it, which in
  // practice means hardware accelerated. Absent when the engine does not say.
  // Browsers expose this and `codec_implementation` only to a page that holds
  // camera or microphone permission, so a receive-only browser client
  // usually leaves both unset.
  optional bool hardware_codec = 11;
}

// The time a video track's frames spent in one stage of their trip between
// the client's app and the model, over one window. `frames` is how many
// frames the reading counted in the stage and `total_ms` the time they spent
// in it together, so the stage's average per frame is total_ms / frames. `total_ms` is a finite number, never negative
// (no NaN or infinity), and `frames` is at least 1, so a reader drops a
// reading that breaks either. The stages cover a frame's whole trip: the
// transport between the client's app and the model, and the model's step that
// turns input into output (input_wait through emit below). A window divides at
// each reading: whoever reads the numbers sums readings to cover a longer
// window. A stage that saw no frame in a window is left out of that reading.
//
// `name` is one of the stages below, in the order a frame goes through them.
// The set grows without a schema change, so a consumer must ignore a name it
// does not know. Each side reports the stages it can see, which is not always
// the side they happen on: libwebrtc carries the sender's encode_wait,
// packetize and pacer inside the video, so the receiver reports those.
//
//   submit         The app hands the frame to the SDK, until the SDK hands it
//                  to libwebrtc. Client, sending.
//   encode_wait    The frame waits for the encoder to take it.
//   encode         The encoder compresses the frame.
//   packetize      The encoded frame is split into RTP packets.
//   pacer          The packets wait in libwebrtc's send pacer.
//   jitter_buffer  The frame waits in the receiver's jitter buffer, as
//                  libwebrtc's jitterBufferDelay counts it.
//   decode         The decoder decompresses the frame.
//   sink_convert   reactor-webrtc's sink converts the decoded frame to BGRA
//                  and hands it to the Python binding. Runtime.
//   handoff        The Python binding waits for the GIL and copies the frame
//                  into Python, until it calls the runtime's sink. Runtime.
//   delivery       The decoded frame goes from the decoder to the app (client)
//                  or from the runtime's sink to the model's input (runtime).
//   to_rgb         Part of delivery: BGRA to RGB. Runtime.
//   loop_wait      Part of delivery: the wait for the runtime's event loop.
//                  Runtime.
//   input_wait     The frame waits in the model's input buffer until a step
//                  reads it. Runtime.
//   process_input  The model's process_input. Runtime.
//   generate       The model's generate. Runtime.
//   process_output The model's process_output. Runtime.
//   emit           The model's emit, until the output reaches the output
//                  pacer. Runtime.
//   output_pacing  The model's output waits for its tick in the runtime's
//                  output pacer. Runtime.
//   output_queue   The paced frame goes from the output pacer to libwebrtc.
//                  Runtime.
//   feed_wait      Part of output_queue: the wait for the feeding thread.
//                  Runtime.
//   to_bgra        Part of output_queue: RGB to BGRA. Runtime.
//   ingest         Part of output_queue: reactor-webrtc takes the frame into
//                  libwebrtc. Runtime.
//
// A stage named "part of" another is inside it, and says so in `part_of`:
// adding both counts that time twice. A reader nests or skips parts by
// `part_of` alone, so a new part needs no change in any reader.
// process_input, generate and process_output are timed once per step and
// counted on each video track the step emits.
//
// encode_wait, packetize and pacer come from libwebrtc's timing frames, a
// sample: libwebrtc marks about one frame every 200 ms, the receiver reports
// the slowest marked frame of the last second, and each time is in whole
// milliseconds. For these three, `frames` counts the sampled frames, not
// every frame, and their average leans toward the slow frames, so when
// adding stages along the trip, treat it as an upper bound rather than a
// mean. Every other stage counts every frame, and its average is a mean.
//
// Only video tracks carry frame stages: on an audio track libwebrtc's
// jitterBufferDelay and jitterBufferEmittedCount count samples, not frames.
message FrameStage {
  string name = 1;
  double total_ms = 2;
  uint64 frames = 3;
  // The stage this one is a part of, whose time includes it; empty for a
  // stage of its own.
  string part_of = 4;
}

// A connection-wide fact, not tied to any one track — e.g.
// "available_outgoing_bitrate_bps" (the encoder's own belief about outgoing
// headroom, not a measurement of the user's internet) or
// "time_to_connect_ms" (how long this connection waited to establish, start
// to "ready"). A client sends this on every batch, since values like the
// outgoing bitrate change over time. One-time facts like "time_to_connect_ms"
// are only included on the first batch after connecting.
message ClientConnectionStat {
  // Epoch milliseconds, the client's own clock.
  int64 timestamp = 1;
  map<string, double> metrics = 2;
  // What the client runs on, so readings can be grouped by it. Sent on every
  // batch. Each field is empty when the client does not know it; a client
  // that predates this field does not send `environment` at all.
  ClientEnvironment environment = 3;
  // Where the messages of the data channel that carries commands spent their
  // time, stage by stage, over the window since the previous batch. See
  // MessageStage.
  repeated MessageStage message_stages = 4;
}

// The time a connection's data-channel messages spent in one stage of their
// trip, over one window. The average per message is total_ms / messages. Only
// the data channel that carries commands is timed, not the control channel.
//
// The stages, in the order a command goes through them. The side that
// reports a stage is the side that times it:
//
//   queue_wait  The message waits in the sender's chunk queue until its first
//               chunk leaves it. Sender.
//   send        From the message's first chunk to its last being handed to
//               SCTP. Sender.
//   stall       The time the sender's chunk pump stopped because SCTP's buffer
//               was full, per message sent. Sender.
//   reassembly  From the message's first chunk arriving to its last. Receiver.
//   handoff     The Python binding waits for the GIL and copies the message
//               into Python, until it calls the runtime's sink. Runtime.
//   loop_wait   The runtime's sink until its event loop takes the message.
//               Runtime.
//   dispatch    The command reaches the runtime until its handler starts,
//               including the wait for the model's step, less any wait for a
//               file the command references. Runtime.
//   start_wait  Part of dispatch: the command is held until the session's
//               starting input is in. Runtime.
//   parse       Part of dispatch: parsing and validating the command, until
//               it is on the model's queue. Runtime.
//   model_queue Part of dispatch: on the model's queue until its loop takes
//               it. Runtime.
//   lock_wait   Part of dispatch: the wait for the step lock, which a running
//               step holds. Runtime.
//   handler     The command's handler runs and its reply is written. Runtime.
//
// A part says which stage it is inside in `part_of`: adding both counts that
// time twice.
//
// queue_wait, send, stall and reassembly come from the chunked channel; a
// channel without chunking reports none of them.
message MessageStage {
  string name = 1;
  double total_ms = 2;
  uint64 messages = 3;
  // The stage this one is a part of, whose time includes it; empty for a
  // stage of its own.
  string part_of = 4;
}

// The SDK and the system a client runs on. `os` and `arch` are canonical
// lowercase values, so the same machine groups under one key whatever
// language the client is written in: a client normalizes what its platform
// reports to them (e.g. "Darwin" or "darwin" to "macos", "arm64" to
// "aarch64", "x64" or "amd64" to "x86_64").
message ClientEnvironment {
  // The SDK, as the same identifier the SDK reports as `client_info.sdk_type`
  // when it creates a session, e.g. "python", "js", "cpp", "swift", "java".
  string sdk_type = 1;
  // The SDK's version, e.g. "1.10.0".
  string sdk_version = 2;
  // The operating system, e.g. "macos", "linux", "windows", "ios",
  // "android", or "browser" for the JavaScript SDK.
  string os = 3;
  // The operating system's version as the client reads it, e.g. "15.1".
  string os_version = 4;
  // The CPU architecture, e.g. "aarch64", "x86_64".
  string arch = 5;
  // The device's hardware model as the system names it, e.g. "iPhone15,2",
  // "Pixel 8" or "MacBookPro18,3". On a phone, decode and encode times track
  // the device more than the operating system's version. Empty when the
  // system does not expose it, as in a browser.
  string device_model = 6;
}

// A batch of client-observed quality readings for this connection, sent
// periodically rather than one message per reading.
message ClientStats {
  repeated ClientTrackStat track_stats = 1;
  // Present on every batch; see ClientConnectionStat for which values are
  // only on the first one.
  ClientConnectionStat connection_stat = 2;
}
