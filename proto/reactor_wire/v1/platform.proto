syntax = "proto3";

package reactor_wire.v1;

import "google/protobuf/struct.proto";

// Liveness heartbeat from the client.
message Ping {}

// Request for the model's schema.
message RequestSchema {}

// The model's schema, carried as an OpenAPI document.
message ModelSchema {
  google.protobuf.Struct openapi = 1;
}

// Notification that a client upload completed and can now be referenced.
message FileUploaded {
  string upload_id = 1;
  string name = 2;
  string mime_type = 3;
  int64 size = 4;
}

// Request a clip of the last duration_seconds of output.
message RequestClip {
  double duration_seconds = 1;
}

// Request a recording of the session so far.
message RequestRecording {}

// A clip or recording is being prepared.
message ClipReady {
  string session_id = 1;
  string kind = 2;
  double start_marker = 3;
  double end_marker = 4;
  double now_marker = 5;
  int64 predicted_ready_at_ms = 6;
  string playlist_url = 7;
}

// A clip or recording request failed.
message ClipFailed {
  string reason = 1;
}

// A content-moderation verdict delivered to the client. A "terminate" action
// means the session is about to end; "warn" is informational and the session
// continues. Fields the sender cannot attribute are left empty.
message Moderation {
  string action = 1;
  string input_kind = 2;
  string command = 3;
  repeated string categories = 4;
  string message = 5;
}

// The platform is ending the session, and this is why. Sent best-effort
// before the connections close, so the client sees the reason rather than a
// bare disconnect. `reason` is the platform-authored, human-readable
// description of the cause, delivered verbatim for the client to display.
message SessionEnded {
  string reason = 1;
}

// A negotiated video codec. New values need a schema change, so this covers
// only the codecs currently in use — extend it as new ones are adopted.
enum VideoCodec {
  VIDEO_CODEC_UNSPECIFIED = 0;
  VIDEO_CODEC_VP8 = 1;
  VIDEO_CODEC_VP9 = 2;
  VIDEO_CODEC_AV1 = 3;
  VIDEO_CODEC_H264 = 4;
  VIDEO_CODEC_H265 = 5;
}

// A negotiated audio codec. Same extend-as-adopted rule as VideoCodec.
enum AudioCodec {
  AUDIO_CODEC_UNSPECIFIED = 0;
  AUDIO_CODEC_OPUS = 1;
}

// A track's media kind. Unlike a codec, this set never grows — every WebRTC
// track is video or audio, permanently.
enum TrackKind {
  TRACK_KIND_UNSPECIFIED = 0;
  TRACK_KIND_VIDEO = 1;
  TRACK_KIND_AUDIO = 2;
}

// A track's direction, from the client's own perspective. The opposite
// polarity of reactor_runtime's own (model-perspective) TrackDirection
// (IN/OUT) — this one is client-perspective (RECVONLY/SENDONLY) — different
// types in different packages, kept distinctly named so the two are never
// confused reading wire and runtime code side by side.
enum TrackDirection {
  TRACK_DIRECTION_UNSPECIFIED = 0;
  TRACK_DIRECTION_RECVONLY = 1;
  TRACK_DIRECTION_SENDONLY = 2;
}

// One WebRTC quality reading the client took for one of its tracks, from the
// browser's own getStats() — the runtime has no other vantage point onto a
// client's receive-side experience. `kind`/`direction`/`codec` are fixed,
// structural facts about the track (never a new value at runtime), so they
// stay typed; `metrics` is where the actual measurements live (e.g.
// "bitrate_bps", "frames_per_second", "packets_lost", "packets_received",
// "jitter_ms", "round_trip_time_ms", "frames_decoded", "frames_dropped",
// "frame_width", "frame_height", "nack_count", "keyframe_requests") — that
// set grows as new stats become worth reporting, without a schema change.
//
// `codec`'s oneof only keeps `video_codec`/`audio_codec` from being set at
// the same time — it does not, and structurally cannot, tie either one to
// `kind`. A conforming sender always sets the arm matching `kind`
// (`video_codec` for TRACK_KIND_VIDEO, `audio_codec` for TRACK_KIND_AUDIO),
// but nothing on the wire rejects a message that doesn't. A consumer must
// treat a codec arm that doesn't match `kind` as absent (the same as an
// unrecognized or *_UNSPECIFIED value) rather than decode it — never trust
// `kind` and the codec arm to agree without checking.
message ClientTrackStat {
  // Epoch milliseconds, the client's own clock.
  int64 timestamp = 1;
  string track_name = 2;
  TrackKind kind = 3;
  TrackDirection direction = 4;
  oneof codec {
    VideoCodec video_codec = 5;
    AudioCodec audio_codec = 6;
  }
  // Whether the client has this track paused right now.
  bool paused = 7;
  map<string, double> metrics = 8;
  // Where this track's frames spent their time, stage by stage, over the
  // window since the previous batch. See FrameStage.
  repeated FrameStage frame_stages = 9;
}

// The time a track's frames spent in one stage of their trip between the
// client's app and the model, over one window. `total_ms` is the time all
// `frames` frames spent in the stage together, so the stage's average per
// frame is total_ms / frames. The stages cover the transport between the
// client's app and the model, not the model's own time. A window divides at each reading: whoever reads the numbers sums
// readings to cover a longer window. A stage that saw no frame in a window is
// left out of that reading.
//
// `name` is one of the stages below, in the order a frame goes through them.
// The set grows without a schema change, so a consumer must ignore a name it
// does not know. Each side reports the stages it can see, which is not always
// the side they happen on: libwebrtc carries the sender's encode_wait,
// packetize and pacer inside the video, so the receiver reports those.
//
//   submit         The app hands the frame to the SDK, until the SDK hands it
//                  to libwebrtc. Client, sending.
//   encode_wait    The frame waits for the encoder to take it.
//   encode         The encoder compresses the frame.
//   packetize      The encoded frame is split into RTP packets.
//   pacer          The packets wait in libwebrtc's send pacer.
//   jitter_buffer  The frame waits in the receiver's jitter buffer, as
//                  libwebrtc's jitterBufferDelay counts it.
//   decode         The decoder decompresses the frame.
//   delivery       The decoded frame goes from the decoder to the app (client)
//                  or to the model's input (runtime).
//   output_pacing  The model's output waits for its tick in the runtime's
//                  output pacer. Runtime.
//   output_queue   The paced frame goes from the output pacer to libwebrtc.
//                  Runtime.
//
// encode_wait, packetize and pacer come from libwebrtc's timing frames, a
// sample: libwebrtc marks about one frame every 200 ms, the receiver reports
// the slowest marked frame of the last second, and each time is in whole
// milliseconds. Every other stage counts every frame.
message FrameStage {
  string name = 1;
  double total_ms = 2;
  uint64 frames = 3;
}

// A connection-wide fact, not tied to any one track — e.g.
// "available_outgoing_bitrate_bps" (the encoder's own belief about outgoing
// headroom, not a measurement of the user's internet) or
// "time_to_connect_ms" (how long this connection waited to establish, start
// to "ready"). A client sends this on every batch, since values like the
// outgoing bitrate change over time. One-time facts like "time_to_connect_ms"
// are only included on the first batch after connecting.
message ClientConnectionStat {
  // Epoch milliseconds, the client's own clock.
  int64 timestamp = 1;
  map<string, double> metrics = 2;
}

// A batch of client-observed quality readings for this connection, sent
// periodically rather than one message per reading.
message ClientStats {
  repeated ClientTrackStat track_stats = 1;
  // Present on every batch; see ClientConnectionStat for which values are
  // only on the first one.
  ClientConnectionStat connection_stat = 2;
}
