syntax = "proto3";

package reactor_wire.v1;

import "google/protobuf/struct.proto";
import "reactor_wire/v1/model.proto";
import "reactor_wire/v1/platform.proto";

// How a Frame's data bytes are encoded.
//
// Encoded video in a stepped session. A client that can send and receive
// encoded step frames declares the session-level SDP attribute
// a=x-reactor-encoded-step-frames in its offer, beside an m-section per
// published input track and per output track, and lists its codec preferences
// on each. A runtime that encodes step frames repeats the attribute in its
// answer, and each video track then carries the codec the answer negotiates
// on its m-section: H.264, VP8, VP9 or AV1 as the encoding of that name. A
// track whose m-section negotiates any other codec, an audio track, and every
// track of a connection whose answer lacks the attribute carry RAW frames.
// The m-sections carry no media in a stepped session: every frame travels in
// the data channel's messages. The negotiation holds for the connection, and
// a new connection negotiates again.
//
// An encoded video track is one stream for the track's whole life on a
// connection, in decode order, and spans requests and results: each step's
// frames continue from the previous step's frames of the same track, so most
// of them are inter frames. Each frame decodes to exactly one frame, which
// keeps the encoded frame's metadata and capture time, and dtype and shape
// describe that decoded frame: uint8 RGB, (height, width, 3). The data
// channel is reliable and ordered, so a stream has no gap the transport made,
// and a sender starts a track's frames at a keyframe only at a break it knows
// of:
//   - the first frames of the track sent on a connection, including a
//     reconnect and an observer that joins;
//   - the first frames after the track is published again on the same
//     connection: unpublishing a track ends its stream, and the runtime
//     drops the track's decoder;
//   - the first frames after frames of the track that were encoded but not
//     sent: a StepResult that is RESULT_TOO_LARGE or that the connection
//     refused to send, on the runtime's side;
//   - the first frames after the receiver lost the stream: a RequestStep with
//     request_keyframe, for the runtime's output, or input_decode_failed for
//     the track, for the client's input: as an Error for a PushFrames, or as
//     a refused StepResult's code for a RequestStep.
// A step or a push with no frames for a track sends nothing for it and leaves
// its stream where it was.
enum FrameEncoding {
  FRAME_ENCODING_UNSPECIFIED = 0;
  // Uncompressed samples in row-major order, described by dtype and shape:
  // uint8 RGB for video, little-endian int16 PCM for audio. Each frame stands
  // alone.
  FRAME_ENCODING_RAW = 1;
  // One H.264 access unit of a video track, in Annex B byte stream format.
  FRAME_ENCODING_H264 = 2;
  // One VP8 frame of a video track, as the encoder emits it.
  FRAME_ENCODING_VP8 = 3;
  // One VP9 frame of a video track, as the encoder emits it.
  FRAME_ENCODING_VP9 = 4;
  // One AV1 temporal unit of a video track: its OBUs, in low-overhead
  // bitstream format.
  FRAME_ENCODING_AV1 = 5;
}

// One frame of a track: a video image or a block of audio samples.
message Frame {
  FrameEncoding encoding = 1;
  // Element type of the decoded array, in NumPy notation ("uint8", "int16").
  string dtype = 2;
  // Dimensions of the decoded array: (height, width, 3) for video,
  // (channels, samples) for audio.
  repeated uint32 shape = 3;
  bytes data = 4;
  // What the sender attached to the frame, opaque to the transport.
  optional bytes metadata = 5;
  // When the sender says the frame was captured, in microseconds.
  optional int64 capture_time_us = 6;
  // Whether the encoded frame is a keyframe, which decodes without the frames
  // before it. A receiver checks that a track's stream starts at one. False
  // for RAW frames, which need no other frame to decode.
  bool keyframe = 7;
}

// The frames of one track, in the order they were produced.
message TrackFrames {
  string track = 1;
  TrackKind kind = 2;
  repeated Frame frames = 3;
  // The rate the frames play at: frames per second for video, samples per
  // second for audio. A step's video rate is that step's own and can differ
  // between steps. Zero when the sender does not say.
  double rate = 4;
}

// Request to run one step of a stepped session. Every field is optional: an
// empty request runs the step on the model's current state, which commands
// sent before it may have changed. The runtime checks the whole request
// first: every upload it references, every call against the model's contract,
// and every frame against its input track. A request that fails a check is
// refused (REFUSED) and changes nothing. A request that passes is applied as
// individual calls, in order: the state, then the commands, then the media
// input, and then the step runs. A call whose handler fails stops the request
// before the step runs (COMMAND_FAILED); the calls applied before it stay
// applied. Nothing else runs between a request's calls and its step, not even
// another client's command.
//
// Every request ends in exactly one response, a StepResult with the request's
// request_id. A connection's requests and commands are handled in the order
// they arrive, even when one waits for an upload: a request sent before the
// previous one's result runs after it, and after every command sent before it.
message RequestStep {
  // Values for the model's state fields, keyed by field name. Each key runs as
  // the model's set_<key> command, in ascending key order, before commands.
  google.protobuf.Struct state = 1;
  // Commands to run after the state, in order. A call carries no request id of
  // its own: its handler's success is answered by the StepResult alone, and a
  // message its handler returns reaches the client uncorrelated, like a
  // broadcast addressed to it.
  repeated Command commands = 2;
  // Frames to write to the model's input tracks, one entry per track. A track
  // takes at most as many frames as its input buffer holds; a request with
  // more is refused. Encoded frames continue the track's stream, the same one
  // PushFrames carries. The runtime decodes them before it checks anything
  // else, so a request it refuses for another reason still moves the stream
  // on. A frame it cannot decode refuses the request (REFUSED, with the entry
  // media_input[<i>] and the code input_decode_failed), and the track's next
  // frames start at a keyframe.
  repeated TrackFrames media_input = 3;
  // Whether every encoded output track of this connection starts this step's
  // frames at a keyframe, for a client whose decoder lost its stream. False or
  // unset asks for nothing and suppresses none of the keyframes the encoding
  // rules call for (see FrameEncoding).
  optional bool request_keyframe = 4;
}

// Frames for the model's input tracks, sent as the client has them, apart from
// any step. Fire-and-forget: the runtime sends no response and never refuses
// one. It handles a PushFrames in the channel's order with the commands and
// the step requests, so its frames are written before any RequestStep sent
// after it runs.
//
// The runtime decodes every encoded frame as it arrives, even one the model
// does not read, so the track's stream stays whole (see FrameEncoding). A
// frame is then written to its track's input buffer, which keeps the newest
// frames when it is full; a frame the runtime cannot take, for a track that is
// not one of the model's input tracks or that the buffer drops, is discarded
// without a word. A frame that cannot be decoded is answered with an Error
// notification, code input_decode_failed and the track in its track field;
// the runtime then discards that track's frames up to the next keyframe, and
// the client starts the track's next frames at one.
message PushFrames {
  repeated TrackFrames tracks = 1;
}

// A file the model kept with a step, beside its media. The bytes are not in
// the message: the step's result is saved with the file, and a client reads it
// from the step results of the session, by the step's number and the file's
// name.
message StepFileRef {
  // The file's name, one path segment.
  string name = 1;
  // The file's media type, guessed from its name.
  string content_type = 2;
  // The file's size in bytes.
  uint64 size = 3;
}

// Why a step has no usable result. New codes can be added: a consumer treats
// any non-zero value, including one it does not know, as a failure, with the
// reason in error.
enum StepFailureCode {
  // The step ran and worked.
  STEP_FAILURE_CODE_UNSPECIFIED = 0;
  // The request, one of its calls, or the model's process_input() refused the
  // step: the session does not step or already took its steps, a call does not
  // fit the model's contract, an upload never arrived, or a track's frames
  // cannot be decoded or do not fit its input buffer. The step did not run and
  // takes no number. A request the runtime refuses before applying it changes
  // nothing; entry names the call or track at fault.
  STEP_FAILURE_CODE_REFUSED = 1;
  // The session cannot run a step yet. The step did not run and takes no
  // number.
  STEP_FAILURE_CODE_NOT_READY = 2;
  // The step ran, and the model reported a failure. It takes a number.
  STEP_FAILURE_CODE_FAILED = 3;
  // The step ran, but its result does not fit in one message on this
  // connection, or the connection refused to send it. It takes a number, and
  // the result carries no media and no data.
  STEP_FAILURE_CODE_RESULT_TOO_LARGE = 4;
  // The handler of one of the request's state keys or commands failed. The
  // calls before it stay applied, the ones after it are skipped, and the step
  // did not run and takes no number.
  STEP_FAILURE_CODE_COMMAND_FAILED = 5;
  // The session ended before the step's result could be sent. Whether the step
  // ran is unknown to the client, so the result carries no step number.
  STEP_FAILURE_CODE_SESSION_ENDED = 6;
}

// The outcome of one step request: what the model produced, per output track,
// or why it produced nothing. The response to a RequestStep.
message StepResult {
  // The step's number in the session, counted from 1: the step of
  // step_completed, result.json, and the session's step routes. Zero when the
  // step did not run, or, for SESSION_ENDED, when whether it ran is unknown.
  uint64 step = 1;
  // The step's frames, one entry per output track it produced. Encoded
  // frames continue the track's stream on this connection from the previous
  // result (see FrameEncoding).
  repeated TrackFrames tracks = 2;
  // Seconds the step's generate() took, or the time the model reported for the
  // step. A saved step records the same value as generate_s in its
  // result.json. Zero when the step did not run, and for SESSION_ENDED, where
  // it says nothing about the step.
  double elapsed_seconds = 3;
  // The extra files the model kept with the step, for a step that worked and
  // was saved. Empty otherwise: when it kept none, is not saved, failed
  // (FAILED), or did not fit a message (RESULT_TOO_LARGE). The step is saved
  // after its result is sent: its files are readable once the step's
  // result.json exists, and a save that fails keeps none, saying why in
  // result.json's save_error.
  repeated StepFileRef files = 4;
  // Why the step failed, in words; unset when it worked.
  optional string error = 5;
  // What kind of failure error describes; unspecified when the step worked.
  StepFailureCode failure_code = 6;
  // A stable code a client branches on. For COMMAND_FAILED, the code the
  // failing handler raised, the code of its CommandError; internal_error for
  // an unplanned failure. For REFUSED, input_decode_failed when a track's
  // encoded frames lost its stream: the track named by entry starts its next
  // frames at a keyframe. Unset for every other outcome.
  optional string code = 7;
  // The entry of the request at fault, for COMMAND_FAILED and for a request
  // the runtime refused: "state.<key>", "commands[<i>]", or
  // "media_input[<i>]". Unset when no single entry is at fault.
  optional string entry = 8;
  // What the model returned for the step besides its media, opaque to the
  // transport: bytes the model returned as they are, or a dict it returned
  // encoded as UTF-8 JSON. It arrives in this message, with the step's frames,
  // so a model whose output is data alone needs no output track. It counts toward the result's size: a result that
  // does not fit one message on the connection is RESULT_TOO_LARGE and carries
  // no data. Unset when the model returned none, and when the step failed.
  optional bytes data = 9;
}
