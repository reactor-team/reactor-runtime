syntax = "proto3";

package reactor_wire.v1;

import "google/protobuf/struct.proto";
import "reactor_wire/v1/model.proto";
import "reactor_wire/v1/platform.proto";

// How a Frame's data bytes are encoded.
enum FrameEncoding {
  FRAME_ENCODING_UNSPECIFIED = 0;
  // Uncompressed samples in row-major order, described by dtype and shape:
  // uint8 RGB for video, int16 PCM for audio.
  FRAME_ENCODING_RAW = 1;
}

// One frame of a track: a video image or a block of audio samples.
message Frame {
  FrameEncoding encoding = 1;
  // Element type of the decoded array, in NumPy notation ("uint8", "int16").
  string dtype = 2;
  // Dimensions of the decoded array: (height, width, 3) for video,
  // (channels, samples) for audio.
  repeated uint32 shape = 3;
  bytes data = 4;
  // What the sender attached to the frame, opaque to the transport.
  optional bytes metadata = 5;
  // When the sender says the frame was captured, in microseconds.
  optional int64 capture_time_us = 6;
}

// The frames of one track, in the order they were produced.
message TrackFrames {
  string track = 1;
  TrackKind kind = 2;
  repeated Frame frames = 3;
}

// Request to run one step of a stepped session. Every field is optional: an
// empty request runs the step on the model's current state, which commands
// sent before it may have changed. The runtime applies the request as
// individual calls, in order: the state, then the commands, then the input
// frames, and then runs the step. A call that fails refuses the step; the calls
// applied before it stay applied.
//
// Every request ends in exactly one response, with its request_id: a
// StepResult once the step has run, whether it worked or failed, or an Error:
// "step_refused" when the request or the model refuses the step, and
// "step_result_too_large" when the result does not fit in one message.
message RequestStep {
  // Values for the model's state fields, keyed by field name. Each key runs as
  // the model's set_<key> command, before commands.
  google.protobuf.Struct state = 1;
  // Commands to run after the state, in order.
  repeated Command commands = 2;
  // Frames to write to the model's input tracks, one entry per track.
  repeated TrackFrames inputs = 3;
}

// A file the model kept with a step, beside its media. The bytes are not in
// the message: the step's result is saved with the file, and a client reads it
// from the step results of the session, by the step's index and the file's
// name.
message StepFileRef {
  // The file's name, one path segment.
  string name = 1;
  // The file's media type, guessed from its name.
  string content_type = 2;
  // The file's size in bytes.
  uint64 size = 3;
}

// The outcome of one step: what the model produced, per output track. The
// response to a RequestStep.
message StepResult {
  // The step's number in the session, counted from 1.
  uint64 index = 1;
  repeated TrackFrames tracks = 2;
  // Seconds the step's generate() took, or the time the model reported for the
  // step. A saved step records the same value as generate_s in its
  // result.json.
  double elapsed = 3;
  // The extra files the model kept with the step. Empty when the step kept
  // none, or when its result is not saved.
  repeated StepFileRef files = 4;
  // Why the step failed, when it ran and reported a failure; unset when it
  // worked. A step the request or the model refuses never runs, so it is
  // answered with an Error and gets no result.
  optional string error = 5;
}
