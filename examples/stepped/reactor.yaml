apiVersion: v1beta
kind: VideoModel

# `reactor build` / `reactor run` read this file: `model:` describes the model,
# `runtime:` names the class to serve, and `build.runtime_version` records the
# reactor-runtime release the workspace was scaffolded against (the install pin
# lives in requirements.txt).
model:
  name: stepped
  version: v0.0.1
  description: |
    Tint and mirror the client's webcam, one step at a time.

runtime:
  import: stepped:Stepped

build:
  runtime_version: "3.1.2"
