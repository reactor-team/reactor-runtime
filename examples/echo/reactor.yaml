$schema: reactor/v1
apiVersion: v1beta
kind: VideoModel

# `reactor build` / `reactor run` read this file: `model:` describes the model,
# `runtime:` names the class to serve, and `build:` defines the image every
# build produces — `build.runtime_version` pins the reactor-runtime release the
# image installs.
model:
  name: echo
  version: v0.0.1
  description: |
    Loop the client's webcam and mic back with a real-time video effect.

runtime:
  import: echo:Echo
  recording:
    enabled: true
    chunk_seconds: 4
    clip_max_seconds: 300
    video_track: main_video
    audio_track: main_audio
    video:
      codec: h264
      preset: veryfast
      crf: 23
    audio:
      codec: aac
      bitrate_kbps: 128

build:
  runtime_version: "3.2.4"
