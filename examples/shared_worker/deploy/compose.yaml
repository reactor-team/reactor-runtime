# The pod in pod.yaml as a Docker Compose project, for a local run. From the
# repository's root, after building the image (see Dockerfile):
#
#   docker compose -f examples/shared_worker/deploy/compose.yaml up
#
# The worker starts first and the sessions wait for its health check; they
# share the socket volume and one memory-backed /dev/shm volume, as the pod's
# containers do. `restart: unless-stopped` stands in for the kubelet. The host
# ports default to the pod's (8079, 8080, 8081); WORKER_HEALTH_PORT,
# SESSION0_PORT, and SESSION1_PORT move them.
x-session: &session
  image: shared-worker
  restart: unless-stopped
  network_mode: host
  depends_on:
    model-worker:
      condition: service_healthy
  volumes:
    - worker-socket:/run/reactor-worker
    - dshm:/dev/shm

services:
  model-worker:
    image: shared-worker
    command: ["python", "-m", "reactor_runtime.model_worker"]
    restart: unless-stopped
    network_mode: host
    environment:
      REACTOR_MODEL_WORKER_HEALTH_PORT: "${WORKER_HEALTH_PORT:-8079}"
      REACTOR_MODEL_WORKER_SOCKET: /run/reactor-worker/sock
      REACTOR_MAX_SESSIONS: "2"
    volumes:
      - worker-socket:/run/reactor-worker
      - dshm:/dev/shm
    healthcheck:
      test: ["CMD", "test", "-e", "/run/reactor-worker/ready"]
      interval: 2s
      retries: 900
  session-0:
    <<: *session
    environment:
      PORT: "${SESSION0_PORT:-8080}"
      REACTOR_MODEL_WORKER_SOCKET: /run/reactor-worker/sock
      REACTOR_SESSION_SLOT: "0"
      WEBRTC_PORT_RANGE: "40000:40999"
      MALLOC_ARENA_MAX: "2"
  session-1:
    <<: *session
    environment:
      PORT: "${SESSION1_PORT:-8081}"
      REACTOR_MODEL_WORKER_SOCKET: /run/reactor-worker/sock
      REACTOR_SESSION_SLOT: "1"
      WEBRTC_PORT_RANGE: "41000:41999"
      MALLOC_ARENA_MAX: "2"

volumes:
  worker-socket: {}
  # One memory-backed /dev/shm for all of them, like the pod's emptyDir: it
  # outlives a restart of the worker, where a shared IPC namespace would not.
  dshm:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=2g
