# The pod in pod.yaml as a Docker Compose project, for a local run. From the
# repository's root, after building the image (see Dockerfile):
#
#   docker compose -f examples/shared_worker/deploy/compose.yaml up
#
# All three start together: a session runtime waits in load() until the model
# server welcomes its slot. They share the socket volume, and each slot has a
# memory-backed volume of its own, mounted at the session's /dev/shm and at
# /run/reactor-shm/s<slot> in the model server. `restart: unless-stopped`
# stands in for the kubelet: a session runtime that loses the model server
# exits, and its restart waits for it again. The host ports default to the
# pod's (8090, 8080, 8081); WORKER_HEALTH_PORT, SESSION0_PORT, and
# SESSION1_PORT move them.
#
# Compose restarts a container that exits, not one that turns unhealthy. A
# model server whose /health reports unhealthy (its model's health(), or a
# step that has run too long) keeps running, and Compose only shows it as
# unhealthy. Restart it by hand:
#
#   docker compose -f examples/shared_worker/deploy/compose.yaml restart model-server
#
# The session runtimes then lose their links, exit, and restart on their own.
x-session: &session
  image: shared-worker
  restart: unless-stopped
  network_mode: host

services:
  model-server:
    image: shared-worker
    command: ["python", "-m", "reactor_runtime.model_server"]
    restart: unless-stopped
    network_mode: host
    environment:
      REACTOR_MODEL_WORKER_HEALTH_PORT: "${WORKER_HEALTH_PORT:-8090}"
      REACTOR_MODEL_WORKER_SOCKET: /run/reactor-worker/sock
      REACTOR_MAX_SESSIONS: "2"
      REACTOR_SHM_SLOT_DIR: /run/reactor-shm/s{slot}
    volumes:
      - worker-socket:/run/reactor-worker
      - shm-s0:/run/reactor-shm/s0
      - shm-s1:/run/reactor-shm/s1
    healthcheck:
      # /health answers 200 while the model loads and its state says when it
      # serves; a 503 (unhealthy) raises here, so it fails the check too. The
      # load gets start_period; after it, three failed checks five seconds
      # apart mark the model server unhealthy.
      test:
        - CMD
        - python
        - -c
        - >-
          import json, os, urllib.request;
          port = os.environ['REACTOR_MODEL_WORKER_HEALTH_PORT'];
          body = json.load(urllib.request.urlopen(f'http://127.0.0.1:{port}/health'));
          raise SystemExit(body['state'] != 'available')
      start_period: 30m
      interval: 5s
      retries: 3
  session-0:
    <<: *session
    environment:
      PORT: "${SESSION0_PORT:-8080}"
      REACTOR_MODEL_WORKER_SOCKET: /run/reactor-worker/sock
      REACTOR_SESSION_SLOT: "0"
      WEBRTC_PORT_RANGE: "40000:40999"
      MALLOC_ARENA_MAX: "2"
    volumes:
      - worker-socket:/run/reactor-worker
      - shm-s0:/dev/shm
  session-1:
    <<: *session
    environment:
      PORT: "${SESSION1_PORT:-8081}"
      REACTOR_MODEL_WORKER_SOCKET: /run/reactor-worker/sock
      REACTOR_SESSION_SLOT: "1"
      WEBRTC_PORT_RANGE: "41000:41999"
      MALLOC_ARENA_MAX: "2"
    volumes:
      - worker-socket:/run/reactor-worker
      - shm-s1:/dev/shm

# Memory-backed, and outliving a restart of either side, like the pod's
# emptyDir volumes. Each holds at most two request blocks and one result block
# (2 * shm_input_bytes + shm_output_bytes, 34 MiB at the default sizes).
volumes:
  worker-socket: {}
  shm-s0:
    driver_opts: {type: tmpfs, device: tmpfs, o: size=64m}
  shm-s1:
    driver_opts: {type: tmpfs, device: tmpfs, o: size=64m}
