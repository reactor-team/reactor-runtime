apiVersion: v1beta
kind: VideoModel

# `reactor build` / `reactor run` read this file: `model:` describes the model,
# `runtime:` names the class to serve, and `build.runtime_version` records the
# reactor-runtime release the workspace was scaffolded against (the install pin
# lives in requirements.txt).
model:
  name: brightness
  version: v0.0.1
  description: |
    A generated, client-controllable gradient with a matching audio tone.

runtime:
  import: brightness:Brightness

build:
  runtime_version: "3.1.2"

recording:
  enabled: true
  chunk_seconds: 4
  clip_max_seconds: 300
  video_track: main_video
  audio_track: main_audio
  video:
    codec: h264
    preset: veryfast
    crf: 23
  audio:
    codec: aac
    bitrate_kbps: 128
