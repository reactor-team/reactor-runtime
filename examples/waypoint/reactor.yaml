$schema: reactor/v2

# `reactor build` / `reactor run` read this file: `model:` describes the model,
# `runtime:` names the class to serve, the config file it reads, and the
# weights it mounts, and `build:` defines the image every build produces.
# There is no Dockerfile; the image is generated from the `build:` block.
model:
  name: waypoint
  version: v0.1.0
  description: |
    Waypoint 1.5: an explorable world seeded from an uploaded frame and driven
    in real time by keyboard and mouse controls. Four frames per step at 1280x720.

runtime:
  import: waypoint:Waypoint
  config: config.yml
  # The weights `get_weights_path()` resolves to on a local run: the
  # Waypoint-1.5-1B checkpoint, pinned to a commit. A deploy names the same
  # reference with `--weights`.
  weights_path: hf://Overworld/Waypoint-1.5-1B@391f92827075edcf4a8b3c8a2ddae010698f8636
  recording:
    enabled: true
    chunk_seconds: 4
    clip_max_seconds: 300
    video_track: main_video
    video:
      codec: h264
      preset: veryfast
      crf: 23

build:
  # Must match the `reactor-runtime==<version>` pin in requirements.txt.
  runtime_version: "3.11.10"
  # The engine compiles kernels at load, so the image builds against the CUDA
  # toolkit rather than the slim Python base.
  cuda_version: "12.9.1"
  # world_engine installs from its git tag.
  system_packages: [git]
  # world_engine's build backend needs setuptools>=80. With cuda_version set,
  # uv reads the PyTorch index first, which carries setuptools<=78.1.0, and by
  # default takes a package only from the first index that has it. This lets
  # the build-isolation resolve reach PyPI for the newer setuptools.
  build_env:
    UV_INDEX_STRATEGY: unsafe-best-match
