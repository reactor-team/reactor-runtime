$schema: reactor/v2

# `reactor build` / `reactor run` read this file: `model:` describes the model,
# `runtime:` names the class to serve and keeps every step it reports, and
# `build:` defines the image every build produces.
model:
  name: stepped-echo
  version: v0.1.0
  description: |
    Answer each step with the last webcam frame it carried, or a black frame,
    and a JSON report of the label, tags, frames, and upload the step saw.
    Built to exercise stepped sessions end to end; no weights.

runtime:
  import: stepped_echo:SteppedEcho
  # Each step is saved as a folder: output.mp4, the step's report.json, and
  # the runtime's result.json.
  step_results:
    enabled: true
    video:
      codec: h264
      preset: veryfast
      crf: 23

build:
  # Must match the `reactor-runtime==<version>` pin in requirements.txt.
  runtime_version: "3.10.1"
