name: Claude Code Review

on:
  pull_request:
    types: [opened, ready_for_review, reopened]
  issue_comment:
    types: [created]

jobs:
  claude-review:
    # Token-burning is gated to maintainers: review runs automatically on a
    # maintainer-authored PR, or on demand when a maintainer comments `/review`.
    # Outside contributors never trigger it implicitly. The `claude-code-review`
    # environment scopes access to the ANTHROPIC_API_KEY.
    if: |
      (
        github.event_name == 'pull_request' &&
        !github.event.pull_request.draft &&
        !contains(github.event.pull_request.title, '[skip-claude]') &&
        github.event.pull_request.user.login != 'dependabot[bot]' &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
      ) || (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.comment.body == '/review' &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
      )
    runs-on: ubuntu-latest
    environment: claude-code-review
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_bots: "graphite-app"
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

            You are a senior engineer reviewing this pull request. Act like a helpful team member who wants to improve code quality while being respectful of the author's work.

            First, run `gh pr view <PR NUMBER> --json title,author` to get the PR title and author.

            ## What this repository is

            reactor-runtime is the open-source (Apache 2.0) Python framework for building and running real-time, interactive video models. Everything in it is public: code, comments, docs, commit messages. The package is managed end-to-end by uv (`uv_build` backend, static version in `pyproject.toml`); a release is a `uv version X.Y.Z` bump commit plus a matching `vX.Y.Z` tag, published to PyPI via trusted publishing. The Makefile is the canonical build interface and CI delegates to make targets (`install-locked`, `lint`, `typecheck`, `test`, `build`, `publish`). Quality gates are ruff (lint + format, Google-style docstrings) and strict mypy, wired through lefthook git hooks and GitHub Actions. Python floor is 3.12.

            Read `AGENTS.md` before reviewing — it carries the engineering standards that tooling cannot enforce, and the review must hold the PR to them.

            ## Standards to hold the PR to (from AGENTS.md)

            - **This repo is public: no private-system references.** Treat Reactor's private monorepo and production services as if they do not exist — no internal service names, package names, repo paths, infrastructure, or tooling. Flag any code, comment, doc, or string that leaks insider context or assumes a private system. This is the single most important thing to catch.
            - **Tests ship with behaviour.** Every PR that adds or changes behaviour must include tests in the same PR (unit tests in `tests/unit/`, integration in `tests/integration/`, mirroring the `src/reactor_runtime/` layout). Flag behaviour changes that arrive without tests.
            - **Strict typing.** mypy runs strict; flag blanket `# type: ignore` without a verifiable reason, and weakening of the type surface. Modern syntax only: `X | None`, builtin generics, no `Optional[...]`/`Dict[...]`.
            - **Docstrings document the contract.** Google style, imperative one-line summary, `Args:`/`Returns:`/`Raises:` when they add information. Public modules/classes/functions need one.
            - **End-state writing.** Comments and docstrings describe what the code does and why, as if it has always been this way — no iteration narration ("previously...", "switched from X to Y", "no longer..."), no double negations, no narrating what the code visibly does.
            - **Releases are tag-driven.** The version field in `pyproject.toml` is only touched by a deliberate `uv version` bump; flag stray version edits in unrelated changes.

            ## Instructions

            1. **CRITICAL: Check for existing review comments BEFORE reviewing the code.**
               Run: `gh api repos/${{ github.repository }}/pulls/<PR NUMBER>/comments`
               Parse the JSON and note each comment's `path`, `line`/`original_line`, and `body`, and whether it is from a previous bot review (look for "claude" or "github-actions" in the user login). Build a mental map of issues that have ALREADY been flagged.

            2. Review the PR diff using `gh pr diff <PR NUMBER>`.

            3. Focus your review on:
               - **Bugs & Logic Errors**: actual bugs, off-by-one, None handling, race conditions, async/await misuse
               - **Security Issues**: hardcoded secrets, unsafe deserialization, command/path injection
               - **Private-system leaks**: any reference that assumes Reactor's private infrastructure (see standards above)
               - **Missing tests** for changed behaviour
               - **Breaking Changes**: public API/protocol contract changes, backwards compatibility
               - **Missing Error Handling**: unhandled exceptions, missing validation
               - **Typing & docstring contract violations** as described in the standards

            4. **DO NOT comment on**:
               - Code that is already good or correct
               - Minor style preferences (leave that to ruff)
               - Pre-existing issues not introduced in this PR
               - Nitpicks or pedantic suggestions
               - **Issues that have ALREADY been flagged in existing comments (even if not fixed yet)**
               - **Issues where an existing comment was marked as "Resolved" by the author**
               - **Any file+line combination that already has a review comment, even if your wording differs**

            5. For each NEW issue you find (not previously commented on):
               - Double-check the existing comments list — if a similar issue exists on the same file/line, SKIP IT
               - Use `mcp__github_inline_comment__create_inline_comment` to comment directly on the specific line of code
               - Keep comments concise (2-4 sentences max)
               - Be specific about what's wrong and why
               - Suggest a concrete fix when possible

            6. **DO NOT post a summary comment.** Only leave inline comments on specific lines that need attention. If you find no NEW issues, don't comment at all — silence means approval.

            ## Review Style

            - Be constructive, not critical
            - Explain the "why" behind suggestions
            - Ask questions if intent is unclear rather than assuming it's wrong
            - NEVER repeat yourself — if you've commented on something before, trust that the author saw it

          claude_args: |
            --allowedTools "Read,Glob,Grep,Bash(gh api:*),Bash(gh pr diff:*),Bash(gh pr view:*),mcp__github_inline_comment__create_inline_comment"
