# Release the wire-protocol on its own CalVer lifecycle, independent of the
# runtime package version. Every push to main that touches the schema builds and
# publishes the language package the runtime vendors.
#
# The version is 1.YYYYMMDD.<run_number> and the GitHub release is tagged
# wire/v<version>, carrying the built Python bindings wheel, generated
# TypeScript sources, and the .proto sources for building bindings in other
# languages. A breaking-change gate against the previous
# release runs first, so a published artifact is always compatible with the one
# before it; an intentional break means cutting reactor_wire.v2, never mutating
# v1.

name: Wire Release

on:
  push:
    branches: [main]
    paths:
      - "proto/**"

permissions:
  contents: write

env:
  # Shared with the other workflows; bump the toolchain pin in one place.
  MISE_VERSION: "2026.6.14"

jobs:
  release:
    name: Build and publish the wire-protocol package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: jdx/mise-action@v2
        with:
          version: ${{ env.MISE_VERSION }}

      # Authoritative compatibility gate: the about-to-be-released sources must
      # not break the previously published wire/v* artifact.
      - name: Breaking-change gate against the last release
        run: mise run //proto:breaking-release

      - name: Compute CalVer version
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          version="1.$(date -u +%Y%m%d).${RUN_NUMBER}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=wire/v${version}" >> "$GITHUB_OUTPUT"
          echo "Releasing wire/v${version}"

      - name: Generate bindings
        run: mise run //proto:gen

      - name: Generate TypeScript bindings
        run: mise run //proto:gen-ts

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the language package and source archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          pkg="build/wire-pkg"
          mkdir -p "${pkg}" dist
          cp proto/packaging/pyproject.toml "${pkg}/pyproject.toml"
          cp -r src/reactor_wire "${pkg}/reactor_wire"
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" "${pkg}/pyproject.toml"
          python -m pip install --quiet build
          python -m build --wheel "${pkg}" --outdir dist/
          tar -czf "dist/reactor-wire-${VERSION}-protos.tar.gz" proto
          tar -czf "dist/reactor-wire-${VERSION}-ts.tar.gz" -C build/wire-ts reactor_wire
          ls -l dist/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "${TAG}" dist/* \
            --title "Wire protocol ${VERSION}" \
            --notes "Reactor wire-protocol \`reactor_wire.v1\` release \`${VERSION}\`.

          - \`reactor_wire-${VERSION}-py3-none-any.whl\` - generated Python bindings, vendored by the runtime build.
          - \`reactor-wire-${VERSION}-ts.tar.gz\` - generated TypeScript sources (protobuf-es v2); extracts to \`reactor_wire/v1/*.ts\`, consumers add \`@bufbuild/protobuf\` as their runtime dependency.
          - \`reactor-wire-${VERSION}-protos.tar.gz\` - \`.proto\` sources for building bindings in other languages.

          Pin in the runtime by setting \`[tool.reactor-wire] version = \"${VERSION}\"\` in \`pyproject.toml\`."
