# Release on tag push. A release is a version-bump commit (`uv version X.Y.Z`)
# plus a matching `vX.Y.Z` tag: the workflow fails fast if the tag and
# pyproject.toml disagree, then builds and publishes to PyPI via trusted
# publishing (OIDC). Requires a trusted publisher configured on PyPI for this
# repository and workflow file.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  # Keep this in step with the other workflows; the toolchain pin lives here so
  # a bump is a one-line change rather than a per-job edit.
  MISE_VERSION: "2026.6.14"

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # A job-level block replaces the workflow's, so contents is restated here:
      # both the wire gate and the build resolve the pinned wire/v* release
      # through the GitHub API.
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The contract bump check compares against the previous v* tag, so
          # the full history and tag set must be present.
          fetch-depth: 0

      - uses: jdx/mise-action@v2
        with:
          version: ${{ env.MISE_VERSION }}

      - name: Verify tag matches pyproject version
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          project_version="$(mise run version)"
          if [[ "$tag_version" != "$project_version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject version $project_version."
            exit 1
          fi

      # The HTTP contract dictates the floor for this release's version bump:
      # a breaking contract diff since the previous release mandates a minor
      # bump, any other contract diff a patch bump — never a major.
      - name: Enforce the contract-mandated version bump
        run: mise run http-breaking-release

      # The build vendors the pinned wire/v* release rather than regenerating
      # it, so the pin is what decides the schema the wheel ships. Fail before
      # the build when that schema is not the one proto/ describes.
      - name: Enforce the pinned wire release matches the proto sources
        run: mise run wire-check-release

      - run: mise run build
      - run: mise run publish
