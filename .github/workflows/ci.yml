# Per-push CI: proto checks, lint, type check, unit tests, and integration
# tests. Every step runs a mise task, so the same commands work locally. Lint
# and type checks run once on the floor Python; the unit tests fan out across
# the supported versions with a GitHub Actions matrix, each leg running a single
# nox session pinned to that version; the integration tests run once on the
# floor Python, since they exercise the media backends rather than per-version
# language behaviour. mise pins the toolchain and jdx/mise-action installs it.

name: CI

on:
  push:
    branches: [main]
  # Run on every PR, including stacked PRs whose base is another feature
  # branch rather than main.
  pull_request:

permissions:
  contents: read

env:
  # The mise release CI standardizes on; every job installs the toolchain at
  # this pin, so bump it here once rather than per job.
  MISE_VERSION: "2026.6.14"

jobs:
  proto:
    name: Proto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v2
        with:
          version: ${{ env.MISE_VERSION }}

      - run: mise run //proto:lint
      - run: mise run //proto:breaking

      # Informational, like the HTTP breaking-diff report: a proto change is
      # meant to drift from the pin until it merges, cuts its wire/v* release,
      # and the pin follows. The release gate is where the drift fails closed.
      - run: mise run wire-check
        env:
          GH_TOKEN: ${{ github.token }}

  # Two checks guard the committed api/openapi.json. The drift gate is blocking:
  # a fresh render of the HTTP surface must equal the committed file byte for
  # byte, so the contract the release gate diffs is always the surface the code
  # actually serves — a stale file fails the build rather than silently diffing
  # a surface that no longer exists. The breaking-diff report is informational:
  # a breaking diff is legal (it mandates a minor bump, enforced at release), so
  # it fails only on tool errors and lands its changelog in the step summary.
  http-surface:
    name: HTTP Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v2
        with:
          version: ${{ env.MISE_VERSION }}

      - run: mise run http-spec-check
      - run: mise run http-breaking

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v2
        with:
          version: ${{ env.MISE_VERSION }}

      - run: mise run lint
        env:
          MISE_LOCK_CHECK_FROM: head

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v2
        with:
          version: ${{ env.MISE_VERSION }}

      - run: mise run install-locked
      # Generate the wire bindings from the in-repo proto (no released wheel or
      # token needed) so ty can resolve reactor_wire.
      - run: mise run //proto:gen
      - run: mise run typecheck

  unit-tests:
    name: Unit Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v2
        with:
          version: ${{ env.MISE_VERSION }}

      # The workflow matrix above fans out the supported versions; this leg runs
      # the single nox session dedicated to its version. Keep the matrix list in
      # step with noxfile.py's PYTHON_VERSIONS. uv (nox's backend) downloads the
      # interpreter, and the session generates the wire bindings from the in-repo
      # proto.
      - run: mise exec -- nox -s "tests-$PYTHON_VERSION"
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v2
        with:
          version: ${{ env.MISE_VERSION }}

      - run: mise run test-integration
