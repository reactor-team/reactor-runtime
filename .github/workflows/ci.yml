# Per-push CI: lint, format, type check, and unit tests. Every step delegates
# to a make target so the same commands are runnable locally. Test jobs run on
# every supported Python version; lint and type checks run once on the floor
# version since their results are version-independent.

name: CI

on:
  push:
    branches: [main]
  # Run on every PR, including stacked PRs whose base is another feature
  # branch rather than main.
  pull_request:

permissions:
  contents: read

jobs:
  proto:
    name: Proto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      - run: make proto-lint
      - run: make proto-breaking

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - run: make install-locked
      - run: make wire-vendor
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: make lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - run: make install-locked
      - run: make wire-vendor
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: make typecheck

  unit-tests:
    name: Unit Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - run: make install-locked
      - run: make wire-vendor
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: make test
