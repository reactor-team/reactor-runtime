# Per-push CI: lint, format, type check, and unit tests. Every step delegates
# to a make target so the same commands are runnable locally. Test jobs run on
# every supported Python version; lint and type checks run once on the floor
# version since their results are version-independent.

name: CI

on:
  push:
    branches: [main]
  # Run on every PR, including stacked PRs whose base is another feature
  # branch rather than main.
  pull_request:

permissions:
  contents: read

jobs:
  proto:
    name: Proto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      - run: make proto-lint
      - run: make proto-breaking

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # PyGObject builds from source against the GObject-introspection and
      # Cairo development libraries; without them the locked sync cannot
      # compile its pycairo/pygobject wheels.
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev libgirepository-2.0-dev libglib2.0-dev pkg-config

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - run: make install-locked
      - run: make wire-vendor
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: make lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # PyGObject builds from source against the GObject-introspection and
      # Cairo development libraries; without them the locked sync cannot
      # compile its pycairo/pygobject wheels.
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev libgirepository-2.0-dev libglib2.0-dev pkg-config

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - run: make install-locked
      - run: make wire-vendor
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: make typecheck

  unit-tests:
    name: Unit Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      # PyGObject builds against the GObject-introspection and Cairo dev
      # libraries, and the WebRTC media engine binds to a native GStreamer
      # install. The media-engine tests import its typelibs at module load
      # (Gst, GstWebRTC, GstSdp, GstVideo, GstRtp), so the running suite needs
      # the GStreamer plugin sets and the gir typelibs present.
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev libgirepository-2.0-dev libglib2.0-dev pkg-config \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            gstreamer1.0-nice gstreamer1.0-libav \
            gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 \
            gir1.2-gst-plugins-bad-1.0

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - run: make install-locked
      - run: make wire-vendor
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: make test
